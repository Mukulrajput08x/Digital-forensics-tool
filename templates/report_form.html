<!DOCTYPE html>
<html>
<head>
<title>Generate Forensic Report</title>

<style>

body{
    font-family: Arial;
    background:#0f172a;
    color:white;
    text-align:center;
}

input{
    padding:10px;
    width:250px;
    margin:10px;
    border-radius:5px;
    border:none;
}

button{
    padding:12px 25px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:6px;
}

</style>

</head>

<body>

<h1>Forensic Report Details</h1>

<form method="POST">

<input type="text" name="case_id" placeholder="Enter Case ID" required>
<br>

<input type="text" name="case_name" placeholder="Enter Case Name" required>
<br>

<input type="text" name="investigator" placeholder="Investigator Name">
<br>

<button type="submit">Generate Report</button>

</form>

</body>
</html>
