<!DOCTYPE html>
<html>
<head>
<title>Timeline Analysis</title>

<style>

body{
    font-family: Arial;
    background:#0f172a;
    color:white;
    text-align:center;
}

table{
    margin:auto;
    border-collapse: collapse;
    width:80%;
}

th,td{
    border:1px solid white;
    padding:10px;
}

th{
    background:#2563eb;
}

#time{
    color:#facc15;
    margin-bottom:20px;
}

input{
    padding:8px;
    width:300px;
    margin-bottom:20px;
}

</style>

</head>

<body>

<h2>File Activity Timeline</h2>

<div id="time">
Current Time : {{time}}
</div>

<input type="text" id="search" placeholder="Search File..." onkeyup="searchFile()">

<table id="timelineTable">

<tr>
<th>File</th>
<th>Created</th>
<th>Modified</th>
</tr>

{% for item in data %}

<tr>
<td>{{item.file}}</td>
<td>{{item.created}}</td>
<td>{{item.modified}}</td>
</tr>

{% endfor %}

</table>

<br>
<a href="/">Back to Home</a>

<script>

function searchFile(){

let input = document.getElementById("search").value.toLowerCase();
let table = document.getElementById("timelineTable");
let tr = table.getElementsByTagName("tr");

for(let i=1;i<tr.length;i++){

let td = tr[i].getElementsByTagName("td")[0];

if(td){

let txt = td.textContent || td.innerText;

if(txt.toLowerCase().indexOf(input) > -1){

tr[i].style.display = "";

}else{

tr[i].style.display = "none";

}

}

}

}

</script>

</body>
</html>
