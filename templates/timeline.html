<!DOCTYPE html>
<html>
<head>
    <title>Investigation Timeline</title>
    <style>
        body {
            background-color: #081224;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        h1 {
            margin: 20px;
        }

        .current-time {
            color: gold;
            font-size: 20px;
            margin: 20px;
        }

        .search-box {
            margin: 20px;
        }

        .search-box input {
            width: 320px;
            padding: 10px;
            font-size: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid white;
            padding: 10px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background-color: #2f66e0;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #0b1730;
        }

        tr:nth-child(odd) {
            background-color: #081224;
        }
    </style>
</head>
<body>

    <h1>Investigation Timeline</h1>
    <div class="current-time">Current Time : {{ time }}</div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search timeline..." onkeyup="searchTable()">
    </div>

    <table id="timelineTable">
        <tr>
            <th>Time</th>
            <th>Type</th>
            <th>Details</th>
        </tr>

        {% for item in data %}
        <tr>
            <td>{{ item["Time"] }}</td>
            <td>{{ item["Type"] }}</td>
            <td>{{ item["Details"] }}</td>
        </tr>
        {% endfor %}
    </table>

    <script>
        function searchTable() {
            let input = document.getElementById("searchInput").value.toLowerCase();
            let table = document.getElementById("timelineTable");
            let tr = table.getElementsByTagName("tr");

            for (let i = 1; i < tr.length; i++) {
                let rowText = tr[i].textContent.toLowerCase();
                tr[i].style.display = rowText.includes(input) ? "" : "none";
            }
        }
    </script>

</body>
</html>
